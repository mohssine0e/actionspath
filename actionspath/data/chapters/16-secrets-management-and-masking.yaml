chapter:
  number: 16
  title: "Secrets Management & Log Masking"
  description: "Safely inject encrypted credentials via secrets.*, understand organization vs repo vs environment hierarchy, and mask values with add-mask."

concepts:
  - title: "The Encrypted Vault"
    content: |
      Hardcoding passwords, API tokens, or SSH keys in Git commits is a catastrophic security disaster. GitHub provides an encrypted secrets vault accessible strictly at execution time.

      **The Bank Armored Delivery Analogy**

      You do not tape $10,000 in cash to your forehead while walking down the street (hardcoded secrets in Git). Instead, the money stays locked inside a subterranean vault until an armored truck delivers the exact needed cash directly into the bank teller's hands inside a secure booth.

      ```
      ┌────────────────────────────────────────────────────────┐
      │ GITHUB SECRETS VAULT (Encrypted with libsodium)        │
      │  DATABASE_PASSWORD = ******************               │
      └──────────────────────────┬─────────────────────────────┘
                                 │ Injected via runner memory
                                 ▼
      ┌────────────────────────────────────────────────────────┐
      │ SAFE STEP INJECTION                                    │
      │                                                        │
      │  - name: Run Database Migrations                       │
      │    env:                                                │
      │      DB_PASS: ${{ secrets.DATABASE_PASSWORD }}        │
      │    run: ./migrate --password "$DB_PASS"                │
      └────────────────────────────────────────────────────────┘
      ```

      **Best Practice: Inject via `env:`, Never Inline in `run:`**
      - **DANGEROUS:** `run: ./deploy.sh ${{ secrets.API_KEY }}` (Can leak in process tables and shell history).
      - **SAFE:** Map to step `env:`, then read `$API_KEY` in the script.

      **Key insight:** Always inject secrets as environment variables into the step scope to prevent argument-injection vulnerabilities.
    key_points:
      - "Secrets are encrypted using libsodium before reaching GitHub storage"
      - "Access secrets via ${{ secrets.<SECRET_NAME> }}"
      - "Always inject secrets via the step env: block rather than inline script strings"

  - title: "Secrets Hierarchy & Fork Protection"
    content: |
      GitHub provides secrets at three distinct administrative levels:
      1. **Organization Secrets:** Shared across multiple repositories in an enterprise.
      2. **Repository Secrets:** Scoped exclusively to a single repository.
      3. **Environment Secrets:** Scoped to a specific deployment environment (e.g. `production`), protected by approval gates.

      ```
      Hierarchy (Most Specific Wins):
      Environment Secret ──► Overrides Repository Secret ──► Overrides Organization Secret
      ```

      **The Fork PR Firewall:**
      When an external contributor opens a pull request from a fork (`on: pull_request`), GitHub completely disables access to all repository secrets.
      This ensures a malicious pull request cannot add `echo "$DATABASE_PASSWORD"` to extract your production credentials.

      **Key insight:** The `pull_request` event isolates forks from your secrets; never switch to `pull_request_target` without rigorous code checkout safeguards.
    key_points:
      - "Secrets resolve hierarchically: Environment > Repository > Organization"
      - "Workflows triggered by fork pull_request events have zero access to secrets"
      - "Environment secrets enable distinct credentials for staging vs production"

  - title: "Automatic Log Masking and `add-mask`"
    content: |
      GitHub Actions automatically scans step output logs and replaces any printed secret values with `***`.

      **Dynamic Value Masking with `add-mask`:**
      If your workflow generates a dynamic secret (like a temporary OAuth token from an API), GitHub does not automatically know to mask it. You must register it with the runner:

      ```yaml
      - name: Generate Temporary Token
        run: |
          TOKEN=$(curl -s https://auth.api.internal/token)
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
      ```

      From that point forward, any accidental `echo "$TOKEN"` in any step will display only `***` in the build logs.

      **The Base64 Pitfall:**
      GitHub only masks the literal string of the secret. If your script base64-encodes a secret, the encoded string will NOT be masked automatically unless you also register the encoded string with `::add-mask::`!

      **Key insight:** Register any dynamically fetched passwords or tokens using `::add-mask::` to prevent accidental log leaks.
    key_points:
      - "Configured secrets are masked with *** in console output automatically"
      - "Mask dynamic runtime tokens using: echo '::add-mask::$VALUE'"
      - "Base64 or transformed representations must be explicitly masked"

command_practice:
  - id: "cmd-01"
    title: "Inspect Environment Variable Masking"
    instructions: |
      **What we're doing:** Simulate registering a masked token with the runner.

      **Why this matters:** In CI workflows, `::add-mask::` tells the runner log parser to redact values.

      **The command pattern:**
      ```
      echo "::add-mask::SuperSecretValue"
      ```

      Run this command:
    command_hint: "echo '::add-mask::SuperSecretValue'"
    validation:
      type: "command_output"
      command: "echo '::add-mask::SuperSecretValue'"
      expected_contains: "add-mask"
    points: 10

scenarios:
  - id: "fix-inline-secret-injection"
    title: "Refactor Inline Secret to Step Env"
    description: |
      A developer passed a sensitive secret directly inside the shell command string: `run: ./deploy.sh --token ${{ secrets.DEPLOY_TOKEN }}`.
      Refactor `.github/workflows/ci.yml` to safely map the secret into the step's `env:` block as `DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}`, and reference it in the command as `"$DEPLOY_TOKEN"`.
    manifest: |
      name: Secure Deployment
      on: [push]
      jobs:
        deploy:
          runs-on: ubuntu-latest
          steps:
            - run: ./deploy.sh --token ${{ secrets.DEPLOY_TOKEN }}
    hints:
      - "Add an 'env:' block under the step."
      - "Set 'DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}' in env, then run './deploy.sh --token \"$DEPLOY_TOKEN\"'."
    solution_validation:
      type: "workflow"
      file: ".github/workflows/ci.yml"
    points: 25

  - id: "mask-dynamic-api-token"
    title: "Mask Dynamically Generated Token"
    description: |
      The step generates a temporary deployment token, but fails to mask it before exporting it.
      Edit `.github/workflows/ci.yml` and add `echo "::add-mask::$TEMP_KEY"` before appending to `$GITHUB_ENV`.
    manifest: |
      name: Token Generation
      on: [push]
      jobs:
        auth:
          runs-on: ubuntu-latest
          steps:
            - name: Generate Key
              run: |
                TEMP_KEY="secret-session-token-xyz"
                echo "TEMP_KEY=$TEMP_KEY" >> "$GITHUB_ENV"
    hints:
      - "Add 'echo \"::add-mask::$TEMP_KEY\"' immediately after generating TEMP_KEY."
    solution_validation:
      type: "workflow"
      file: ".github/workflows/ci.yml"
    points: 25

quiz:
  questions:
    - type: "multiple_choice"
      question: "Why should secrets be injected via the step 'env:' block rather than interpolated directly into 'run:'?"
      options:
        - "Prevents shell argument injection and stops secrets from being logged in process command tables"
        - "Step env variables run faster"
        - "GitHub rejects workflows with ${{ secrets.* }} in run blocks"
        - "Environment variables bypass secret encryption"
      correct: "Prevents shell argument injection and stops secrets from being logged in process command tables"
      explanation: "Direct string interpolation is vulnerable to shell parsing attacks and exposes arguments to process monitoring tools like ps."
      points: 10

    - type: "true_false"
      question: "Pull requests opened from forked repositories automatically have full access to repository secrets."
      correct: false
      explanation: "For security, pull_request runs from forks have zero access to repository secrets."
      points: 10

    - type: "multiple_choice"
      question: "Which workflow command registers a dynamically created string to be redacted with *** in logs?"
      options:
        - "::add-mask::<value>"
        - "::hide-secret::<value>"
        - "::encrypt::<value>"
        - "::redact::<value>"
      correct: "::add-mask::<value>"
      explanation: "::add-mask::<value> instructs the GitHub Actions runner log streamer to mask every subsequent occurrence with ***."
      points: 10
