scenarios:
- id: "configure-workflow-dispatch-runbook"
  title: "Configure Emergency Rollback Dispatch Trigger"
  description: |
    Create a manual disaster recovery trigger in `.github/workflows/ci.yml` using `workflow_dispatch:` with an input parameter for `target_version`.
  manifest: |
    name: Emergency Runbook
    on:
      workflow_dispatch:
        inputs:
          target_version:
            description: 'Version tag to restore'
            required: true
            type: string
    jobs:
      rollback:
        runs-on: ubuntu-latest
        steps:
          - run: echo "Restoring version ${{ inputs.target_version }}..."
  hints:
  - "Use 'on: workflow_dispatch:' with typed inputs."
  - "Reference input with '${{ inputs.target_version }}'."
  solution_validation:
    type: "workflow"
    file: ".github/workflows/ci.yml"
    assertions:
    - path: on.workflow_dispatch
      exists: true
      message: 'Emergency runbook workflow must declare on: workflow_dispatch trigger.'
  points: 25

- id: "enforce-production-governance"
  title: "Enforce Production Deployment Governance"
  description: |
    Update `.github/workflows/ci.yml` to attach the `production` environment and concurrency lock `group: production-deploy` with `cancel-in-progress: false` to ensure disaster recovery runbooks execute safely.
  manifest: |
    name: Production Recovery
    on: [workflow_dispatch]
    jobs:
      restore:
        runs-on: ubuntu-latest
        steps:
          - run: echo "Safely restoring infrastructure..."
  hints:
  - "Add 'environment: production' under 'restore:'."
  - "Add 'concurrency: group: production-deploy' with 'cancel-in-progress: false'."
  solution_validation:
    type: "workflow"
    file: ".github/workflows/ci.yml"
    assertions:
    - path: jobs.prod-deploy.environment.name
      equals: production
      message: 'Production deployment must use environment: production with approval
        gate.'
  points: 25

quiz:
  questions:
  - type: "multiple_choice"
    question: "Which trigger allows on-call engineers to manually run emergency runbooks
      with custom input parameters?"
    options:
    - "workflow_dispatch"
    - "push"
    - "pull_request"
    - "schedule"
    correct: "workflow_dispatch"
    explanation: "workflow_dispatch enables manual UI/API triggering with typed form
      input parameters."
    points: 10

  - type: "true_false"
    question: "Actions Runner Controller (ARC) spins up ephemeral Kubernetes pods
      that terminate immediately after completing a single job."
    correct: true
    explanation: "ARC creates single-use ephemeral pods that self-destruct upon completion
      to guarantee pristine isolation."
    points: 10

  - type: "multiple_choice"
    question: "What security feature blocks developers from running 'git push' if
      their commit contains plaintext API keys or credentials?"
    options:
    - "Push Protection for Secrets"
    - "Dependabot"
    - "CodeQL Autobuild"
    - "GitHub Pages"
    correct: "Push Protection for Secrets"
    explanation: "GitHub Secret Scanning Push Protection intercepts pushes containing
      recognized secrets and rejects them before commit arrival."
    points: 10
  - id: q-fill-workflow-dispatch
    type: fill_yaml
    question: What trigger keyword enables manual execution with custom input 
      parameters from GitHub UI or API?
    yaml_template: "on:\n  __________:\n    inputs:\n      target_env:\n        description:
      'Target cluster environment'\n        required: true\n"
    expected: workflow_dispatch
    explanation: "'workflow_dispatch' enables manual triggering of pipelines with
      configurable parameters."
    points: 10
