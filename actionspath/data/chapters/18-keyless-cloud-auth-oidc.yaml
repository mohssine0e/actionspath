chapter:
  number: 18
  title: "Keyless Cloud Authentication (OIDC)"
  description: "Connect GitHub Actions securely to AWS, GCP, and Azure using OpenID
    Connect (OIDC), eliminating static IAM access keys."

concepts:
- title: "The End of Static Cloud Secrets"
  content: |
    Historically, deploying to AWS or GCP required creating permanent IAM access keys (`AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`) and pasting them into GitHub Secrets.

    **The Doormat Key vs Biometric Smart Lock Analogy**

    Hiding a physical metal key under the front doormat (static cloud secrets) means anyone who finds it can unlock your house forever.
    OpenID Connect (OIDC) is like a biometric smart badge. The runner walks up to the cloud door, proves it is the authorized employee working on Shift #42 in Room 3 (GitHub verified JWT token), receives a digital visitor badge that expires in 15 minutes, and throws it away.

    ```
    ┌────────────────────────────────────────────────────────┐
    │ GITHUB ACTIONS RUNNER                                  │
    │  - Generates cryptographically signed OIDC JSON Token  │
    │    Claims: repo:acme/backend, branch:main, sha:abc123  │
    └──────────────────────────┬─────────────────────────────┘
                               │ Presents token to Cloud STS
                               ▼
    ┌────────────────────────────────────────────────────────┐
    │ CLOUD PROVIDER (AWS / GCP / Azure)                     │
    │                                                        │
    │  1. Verifies GitHub signature                          │
    │  2. Validates Trust Policy (Matches exact repo & branch)│
    │  3. Issues temporary, scoped 15-minute STS credentials │
    └────────────────────────────────────────────────────────┘
    ```

    **Key insight:** OIDC completely eliminates static cloud credentials from your GitHub repository; there are no secrets to leak or rotate.
  key_points:
  - "Static IAM keys are a massive security liability and frequent attack vector"
  - "OIDC exchanges short-lived cryptographic tokens for cloud provider credentials"
  - "Temporary credentials expire automatically and leave zero secrets in GitHub"

  diagram:
    title: Keyless OIDC Identity Token Exchange Flow
    diagram: "GitHub Action Runner               GitHub OIDC Provider            \
      \      Cloud STS (AWS/GCP/Azure)\n         │                               \
      \     │                                        │\n         │ 1. Request JWT
      token with          │                                        │\n         │ \
      \   permissions: id-token: write    │                                      \
      \  │\n         ├───────────────────────────────────▶│                      \
      \                  │\n         │                                    │      \
      \                                  │\n         │ 2. Issues cryptographically
      signed │                                        │\n         │    JWT with repo/ref/sha
      claims    │                                        │\n         │◀───────────────────────────────────┤\
      \                                        │\n         │                     \
      \                                                        │\n         │ 3. Send
      JWT: aws-actions/configure-aws-credentials(role-to-assume)          │\n    \
      \     ├────────────────────────────────────────────────────────────────────────────▶│\n\
      \         │                                                                \
      \             │\n         │ 4. Cloud verifies signature against https://token.actions.githubusercontent.com\n\
      \         │    and validates Subject claim (repo:owner/repo:ref:refs/heads/main)\
      \        │\n         │                                                     \
      \                        │\n         │ 5. Returns short-lived, 1-hour STS credentials\
      \                              │\n         │◀────────────────────────────────────────────────────────────────────────────┤\n\
      \         ▼\n  Secure cloud deployment without any long-lived secret keys!"
- title: "The `id-token: write` Permission & Claims"
  content: |
    To request an OIDC token from GitHub's internal identity provider, the workflow must declare the `id-token: write` permission.

    **Token Claims (The Identity Payload):**
    The OIDC token generated by GitHub contains trusted metadata:
    - `iss`: `https://token.actions.githubusercontent.com`
    - `aud`: Target audience (e.g. `sts.amazonaws.com`)
    - `sub`: `repo:<org>/<repo>:ref:refs/heads/main`
    - `repository`: `<org>/<repo>`
    - `job_workflow_ref`: Path to the executing workflow

    **Cloud Trust Policy:**
    Your cloud provider (e.g. AWS IAM Role Trust Policy) configures an assertion matching the `sub` claim. If an attacker runs the workflow in a different repo, the cloud provider rejects the token!

    **Key insight:** The `sub` claim guarantees that only your exact repository and branch can assume the cloud IAM role.
  key_points:
  - "Workflows require 'permissions: id-token: write' to issue OIDC tokens"
  - "The token carries cryptographically signed claims including repo and branch"
  - "Cloud trust policies restrict access to exact repository subjects"

- title: "Real-World OIDC: AWS & GCP"
  content: |
    Official cloud actions handle the token exchange transparently.

    **AWS Example (`aws-actions/configure-aws-credentials`):**
    ```yaml
    permissions:
      id-token: write   # Required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubDeployRole
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync ./dist s3://my-prod-bucket/
    ```

    **Google Cloud Example (`google-github-actions/auth`):**
    ```yaml
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/123/locations/global/workloadIdentityPools/github/providers/my-repo'
        service_account: 'deployer@my-project.iam.gserviceaccount.com'
    ```

    **Key insight:** No secrets are passed to `configure-aws-credentials` or `google-github-actions/auth`—only role identifiers.
  key_points:
  - "AWS configure-aws-credentials uses role-to-assume with zero static keys"
  - "GCP auth uses Workload Identity Federation"
  - "Enables fine-grained least-privilege cloud access control"

command_practice:
- id: "cmd-01"
  title: "Inspect AWS CLI Tooling in Environment"
  instructions: |
    **What we're doing:** Inspect the AWS command-line interface availability.

    **Why this matters:** Runner environments include cloud CLIs ready to use after OIDC authentication.

    **The command pattern:**
    ```
    which aws || echo "Ready for cloud CLI"
    ```

    Run this command:
  command_hint: "which aws || echo 'Ready for cloud CLI'"
  validation:
    type: "command_output"
    command: "which aws || echo 'Ready for cloud CLI'"
    expected_contains: ""
  points: 10

scenarios:
- id: "fix-missing-id-token-permission"
  title: "Add Required id-token Permission for OIDC"
  description: |
    The AWS credential configuration step fails with `Error: Credentials could not be retrieved: OpenIDConnect provider not found` because the workflow token lacks `id-token: write`.
    Edit `.github/workflows/ci.yml` and add `id-token: write` to the job's `permissions:` block.
  manifest: |
    name: Cloud Deploy
    on: [push]
    jobs:
      deploy:
        runs-on: ubuntu-latest
        permissions:
          contents: read
        steps:
          - uses: actions/checkout@v4
          - uses: aws-actions/configure-aws-credentials@v4
            with:
              role-to-assume: arn:aws:iam::123456789012:role/DeployRole
              aws-region: us-east-1
  hints:
  - "OIDC token requests require 'id-token: write' permission."
  - "Add 'id-token: write' under 'permissions:'."
  solution_validation:
    type: "workflow"
    file: ".github/workflows/ci.yml"
    assertions:
    - path: permissions.id-token
      equals: write
      message: 'Workflow permissions must specify id-token: write.'
  points: 25

- id: "migrate-to-keyless-role"
  title: "Migrate Static AWS Keys to Keyless Role"
  description: |
    The workflow currently uses insecure static credentials `aws-access-key-id` and `aws-secret-access-key`.
    Refactor `.github/workflows/ci.yml` to remove the static keys and use `role-to-assume: arn:aws:iam::123456789012:role/ProductionRole`.
  manifest: |
    name: AWS Sync
    on: [push]
    jobs:
      sync:
        runs-on: ubuntu-latest
        permissions:
          id-token: write
          contents: read
        steps:
          - uses: aws-actions/configure-aws-credentials@v4
            with:
              aws-access-key-id: ${{ secrets.AWS_KEY }}
              aws-secret-access-key: ${{ secrets.AWS_SECRET }}
              aws-region: us-west-2
  hints:
  - "Delete aws-access-key-id and aws-secret-access-key."
  - "Add 'role-to-assume: arn:aws:iam::123456789012:role/ProductionRole'."
  solution_validation:
    type: "workflow"
    file: ".github/workflows/ci.yml"
    assertions:
    - path: jobs.deploy.steps
      has_step_using: configure-aws-credentials
      message: Must use aws-actions/configure-aws-credentials with 
        role-to-assume.
  points: 25

quiz:
  questions:
  - type: "multiple_choice"
    question: "Which permission MUST be declared in a workflow to enable keyless OIDC
      token generation?"
    options:
    - "id-token: write"
    - "tokens: write"
    - "security: write"
    - "auth: write"
    correct: "id-token: write"
    explanation: "id-token: write authorizes GitHub's OIDC provider to mint a signed
      identity token for the running job."
    points: 10

  - type: "true_false"
    question: "With OIDC, no permanent AWS or GCP secret keys need to be stored in
      GitHub Secrets."
    correct: true
    explanation: "OIDC authenticates using transient identity tokens exchanged for
      short-lived cloud credentials."
    points: 10

  - type: "multiple_choice"
    question: "Which token claim ensures that only your specific repository and branch
      can assume the cloud role?"
    options:
    - "sub (subject)"
    - "iss (issuer)"
    - "aud (audience)"
    - "jti (JWT ID)"
    correct: "sub (subject)"
    explanation: "The 'sub' claim contains the unique string 'repo:<owner>/<repo>:ref:refs/heads/<branch>'."
    points: 10

  - type: "fill_yaml"
    question: "Fill in the permission required to issue OIDC identity tokens to cloud
      providers:"
    yaml_template: |
      permissions:
        <BLANK>: write
    expected: "id-token"
    explanation: "The 'id-token: write' permission authorizes the runner to request
      an OIDC JWT token."
    points: 10
