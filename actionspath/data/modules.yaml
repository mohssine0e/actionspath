# ActionsPath Curriculum: Beginner to Mastery
# 30 Chapters structured across 6 progressive learning tiers

modules:
  - id: 1
    name: "Module 1: Foundations of CI/CD"
    description: "Core workflow anatomy, execution graphs, syntax gotchas, contexts, and environment variables."
    chapters: [1, 2, 3, 4, 5]

  - id: 2
    name: "Module 2: Runners & Matrix Automation"
    description: "Self-hosted runners, dynamic matrices, Docker container steps, and background service containers."
    chapters: [6, 7, 8, 9, 10]

  - id: 3
    name: "Module 3: Artifacts, Releases & Monorepos"
    description: "Passing build artifacts, generating GitHub releases, package publishing, and monorepo path filters."
    chapters: [11, 12, 13, 14, 15]

  - id: 4
    name: "Module 4: Security, Secrets & Cloud Governance"
    description: "Environment approval gates, OIDC keyless cloud auth (AWS/GCP), CodeQL SAST, and supply chain security."
    chapters: [16, 17, 18, 19, 20]

  - id: 5
    name: "Module 5: Custom Actions & Pipeline Reusability"
    description: "Reusable workflows, composite actions, custom TypeScript/Docker actions, and local testing with act."
    chapters: [21, 22, 23, 24, 25]

  - id: 6
    name: "Module 6: Enterprise Automation & Deployment Strategies"
    description: "ChatOps, automated issue management, Blue-Green deployments, canary rollouts, and pipeline telemetry."
    chapters: [26, 27, 28, 29, 30]
