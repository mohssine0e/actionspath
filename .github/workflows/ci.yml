name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run Test Suite (pytest)
        run: uv run pytest tests/

  build-and-verify:
    name: Build Wheel & Smoke Test CLI
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build Wheel & Source Dist
        run: uv build

      - name: Install Editable CLI
        run: uv tool install --editable .

      - name: Smoke Test CLI Executables
        run: |
          actionspath --help
          actionspath doctor
          actionspath stats

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: actionspath-dist
          path: dist/*
          retention-days: 7
